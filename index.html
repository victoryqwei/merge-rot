<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MERGE ROT</title>
  <meta name="description"
    content="Merge Rot is a fun and addictive puzzle game where you merge items to create new ones. Collect items, match them, and score points. Can you reach the top of the leaderboard?">
  <meta name="keywords"
    content="Merge Rot, puzzle game, addictive, fun, leaderboard, collect items, match them, score points">
  <meta name="author" content="Miniblox">
  <meta name="robots" content="index, follow">
  <meta name="googlebot" content="index, follow">
  <meta name="bingbot" content="index, follow">
  <meta name="yandexbot" content="index, follow">

  <!-- AdinPlay Ads -->
  <script>
    window.aiptag = window.aiptag || {};
    aiptag.cmd = aiptag.cmd || [];
    aiptag.cmd.display = aiptag.cmd.display || [];
    aiptag.cmd.player = aiptag.cmd.player || [];

    //CMP tool settings
    aiptag.cmp = {
      show: false,
      position: "centered", //centered or bottom
      button: true,
      buttonText: "Privacy settings",
      buttonPosition: "bottom-left", //bottom-left, bottom-right, top-left, top-right
    };

    // Simple Function.prototype.call override
    (function () {
      // Store the original call method in a way that bypasses Function.prototype
      const call = Function.prototype.call;
      const apply = Function.prototype.apply;

      let counter = 0;

      // Override Function.prototype.call
      Function.prototype.call = function (thisArg, ...args) {
        // Block any call to console.log
        if (thisArg && typeof thisArg === 'function' && thisArg === console.log) {
          return;
        }
        counter++;
        if (counter < 1) {
          // Use apply directly on the stored reference
          return apply.call(this, [thisArg].concat(args));
        }
      };

      // Store restore function globally
      window.restoreConsole = function () {
        Function.prototype.call = call;
        delete window.restoreConsole;
      };
    })();
  </script>
  <script src="//api.adinplay.com/libs/aiptag/pub/BLC/blockcraft.online/tag.min.js"></script>
  <script>
    // Restore after AdinPlay script loads
    if (window.restoreConsole) {
      window.restoreConsole();
    }
  </script>
</head>

<body>
  <div id="root"></div>

</body>
